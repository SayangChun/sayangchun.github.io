            <p><strong>这是「不推荐」条目的示例。</strong>结论徽章为红色拇指向下，其余字段与推荐条目完全一致。</p>
            <p>读到一半弃书也是一种有信息量的结论——可以在正文里说明弃在第几章、为什么弃。</p>
            <p>Steam 体系的另一个细节：不推荐的评论更需要把「差在哪」写具体，避免只留情绪。模板建议：预期 → 实际 → 差距 → 谁仍然可能喜欢它。</p>
