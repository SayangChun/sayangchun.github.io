        <h1>关于比特币的思考</h1>
        <p class="entry-date">2026年9月13日</p>

        <div class="entry-content">
            <p>很多人想穿越回2010年购买比特币。但在将来十年间，也会有更多人后悔没有在2026年多买点比特币。</p>
            <p>或许有其他币或者Web2的资产的涨幅超过比特币，但唯有比特币，是永远看涨的资产中涨幅最大的，因为它存储着人类文明的生产力。</p>
