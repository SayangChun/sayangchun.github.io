<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="icon" type="image/png" href="avatar.png">
    <link rel="stylesheet" href="assets/style.css">

<body>
    <div class="container">

        <h1>评测</h1>

        <p class="review-stats">共 0 篇评测</p>

        <div class="review-filters">
            <div class="filter-group" data-filter-group="type">
                <span class="filter-label">类型:</span>
            </div>
            <div class="filter-group" data-filter-group="verdict">
                <span class="filter-label">结论:</span>
            </div>
        </div>

        <div class="review-list">

            <div class="entry review-card" data-type="game" data-verdict="recommended">
                <a class="review-cover" href="posts/reviews/gta-v.html"><img src="assets/covers/gta-v.jpg" alt="Grand Theft Auto V 封面"></a>
                <div class="review-body">
                    <div class="review-head">
                        <a class="entry-title" href="posts/reviews/gta-v.html">Grand Theft Auto V</a>
                        <span class="review-verdict up">👍 推荐</span>
                    </div>
                    <p class="review-meta">总时数 109.4 小时 · 完成于 2023年7月26日</p>
                    <p class="review-one">安能摧眉折腰事权贵，使我不得开心颜！</p>
                </div>
            </div>

            <div class="entry review-card" data-type="book" data-verdict="not-recommended">
                <a class="review-cover" href="posts/reviews/demo-book.html"><span>📖</span></a>
                <div class="review-body">
                    <div class="review-head">
                        <a class="entry-title" href="posts/reviews/demo-book.html">示例条目 · 一本不推荐的书</a>
                        <span class="review-verdict down">👎 不推荐</span>
                    </div>
                    <p class="review-one">不推荐的条目用红色拇指标注，正文里写清楚扣分的理由。</p>
                </div>
            </div>

        </div>

        <p class="review-empty">没有符合条件的评测。</p>

    </div>
</body>
</html>
